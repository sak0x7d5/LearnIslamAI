[project]
name = "islam-ai"
version = "0.1.0"
description = "A local-first Quran and Hadith research assistant"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
keywords = ["chainlit", "islamic", "rag", "quran", "hadith"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiosqlite==0.22.1",
    "chainlit==2.10.1",
    "colorlog==6.10.1",
    "faiss-cpu==1.13.2",
    "langchain-community==0.4.1",
    "langchain-core==1.2.24",
    "langchain-google-genai==4.2.1",
    "langchain-huggingface==1.2.1",
    "langchain-text-splitters==1.1.1",
    "langgraph==1.1.4",
    "langgraph-prebuilt==1.0.8",
    "numpy==2.2.6",
    "platformdirs==4.10.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.3.0",
    "sqlalchemy==2.0.48",
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pyyaml==6.0.3",
    "ruff==0.15.20",
]

[tool.uv]
package = false
required-version = "==0.11.29"
default-groups = []
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
