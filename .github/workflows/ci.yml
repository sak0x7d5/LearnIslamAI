name: Windows quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / CPU
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      ISLAMAI_LLM_PROVIDER: google
      GOOGLE_API_KEY: ci-placeholder-not-used
      GEMINI_MODEL: gemini-3.1-flash-lite
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Mutable app state must stay outside the repository (a test enforces it),
      # and the runner context is only available inside steps, not job-level env.
      - name: Point mutable app state at the runner temp directory
        shell: pwsh
        run: |
          $appHome = Join-Path $env:RUNNER_TEMP "IslamAI"
          "ISLAMAI_HOME=$appHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --locked --group dev --python 3.12

      - name: Reject GPU, vision, and audio packages
        shell: pwsh
        run: |
          $installed = @(
            uv run --no-sync python -c "import importlib.metadata as m; print('\n'.join(sorted(d.metadata['Name'].lower() for d in m.distributions() if d.metadata['Name'])))"
          )
          $forbidden = @("faiss-gpu", "torchvision", "torchaudio")
          foreach ($package in $forbidden) {
            if ($installed -contains $package) {
              throw "Forbidden runtime package installed: $package"
            }
          }
          $cudaPackages = @($installed | Where-Object {
            $_ -match '^nvidia-.*-cu[0-9]+$' -or
            $_ -match '^pytorch-triton' -or
            $_ -eq 'triton'
          })
          if ($cudaPackages.Count -gt 0) {
            throw "CUDA runtime packages installed: $($cudaPackages -join ', ')"
          }
          uv run --no-sync python -c "import faiss, torch; assert torch.version.cuda is None, torch.version.cuda; assert not torch.cuda.is_available(); print('CPU torch and FAISS import OK')"

      - name: Check dependency consistency
        run: |
          uv pip check
          uv run --no-sync python -c "import langgraph.prebuilt; print('LangGraph packages import together')"

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest

      - name: Import application
        run: uv run --no-sync python -c "import sys; sys.path.insert(0, 'src'); import app; print('IslamAI import OK')"

      - name: Smoke-test loopback launch
        shell: pwsh
        run: |
          $arguments = @(
            "-m", "chainlit", "run", "src/app.py",
            "--headless", "--ci", "--host", "127.0.0.1", "--port", "8000"
          )
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          $server = Start-Process -FilePath $python -ArgumentList $arguments -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($server.HasExited) {
                throw "Chainlit exited before becoming ready (exit $($server.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8000" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Chainlit did not become ready on the loopback interface."
            }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }
